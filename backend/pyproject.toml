[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mathclub-person1-backend"
version = "0.3.0"
description = "MathClub backend APIs, data service, uploads, review and integration workers"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.121,<1",
  "google-genai>=0.1.0",
  "httpx>=0.27,<1",
  "opencv-python>=4.9.0",
  "pillow>=10.2.0",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=2.1.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23.0", "ruff>=0.17,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.topic_classifier" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/extraction/utils/transport.py" = ["E731"]
